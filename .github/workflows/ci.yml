name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      REDIS_URL: redis://localhost:6379
      AI_PROVIDER: ollama
      AI_BASE_URL: http://localhost:11434/v1
      AI_API_KEY: not-needed
      AI_VISION_MODEL: gemma3:latest
      AI_TEXT_MODEL: gemma3:latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Test (pytest)
        run: pytest tests/ -v

  frontend-type-check:
    name: Frontend — Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Test (Jest)
        run: npm test -- --watchAll=false --passWithNoTests

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write placeholder .env
        run: |
          cat > .env <<'EOF'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=ci-placeholder-secret-at-least-32-chars-long
          GITHUB_CLIENT_ID=placeholder
          GITHUB_CLIENT_SECRET=placeholder
          GOOGLE_CLIENT_ID=placeholder
          GOOGLE_CLIENT_SECRET=placeholder
          POSTGRES_USER=hangar
          POSTGRES_PASSWORD=hangar
          POSTGRES_DB=hangar
          DATABASE_URL=postgresql+asyncpg://hangar:hangar@postgres:5432/hangar
          REDIS_URL=redis://redis:6379
          AI_PROVIDER=ollama
          AI_BASE_URL=http://host.docker.internal:11434/v1
          AI_API_KEY=not-needed
          AI_VISION_MODEL=gemma3:latest
          AI_TEXT_MODEL=gemma3:latest
          WEATHER_LAT=0.0
          WEATHER_LON=0.0
          UPLOAD_DIR=/app/uploads
          MAX_UPLOAD_SIZE_MB=10
          ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Build images (backend + frontend)
        run: docker compose build backend frontend
